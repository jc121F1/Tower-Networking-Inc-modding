name: Package release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create mod archive
        run: |
          mkdir -p dist
          zip -r "dist/power-over-ethernet-${GITHUB_REF_NAME}.zip" \
            README.md entry.lua mod.jsonc lib

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/power-over-ethernet-${GITHUB_REF_NAME}.zip" \
            --generate-notes